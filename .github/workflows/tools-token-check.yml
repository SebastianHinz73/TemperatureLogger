name: Tools token check

# Manual check that the GitHub App secrets can read the release assets of the private
# Tools repository. It neither creates nor changes anything.
# Delete this file once the GitHub App is set up and verified.

on:
  workflow_dispatch:
    inputs:
      monitor_version:
        description: "TemperaturMonitor version to look for in the Tools repository"
        required: false
        default: "1.0.0"

jobs:
  check:
    name: Verify the App token
    runs-on: ubuntu-latest
    steps:
      - name: Create access token for the Tools repository
        id: tools-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TOOLS_APP_ID }}
          private-key: ${{ secrets.TOOLS_APP_PRIVATE_KEY }}
          owner: SebastianHinz73
          repositories: Tools
          permission-contents: read

      - name: List the release assets of the Tools repository
        env:
          GH_TOKEN: ${{ steps.tools-token.outputs.token }}
          VERSION: ${{ inputs.monitor_version }}
        run: |
          set -euo pipefail

          # Same lookup as in the release job of the build workflow
          gh api "repos/SebastianHinz73/Tools/releases?per_page=100" \
            --jq '.[].assets[] | "\(.name)\t\(.id)"' > assets.tsv

          if [ ! -s assets.tsv ]; then
            echo "::error::No release assets found. Either the Tools repository has no published release, or the App has no access to it."
            exit 1
          fi

          echo "Assets in SebastianHinz73/Tools:"
          cut -f1 assets.tsv | sort | sed 's/^/  /'

          missing=0
          for wanted in "TemperaturMonitor-${VERSION}.msi" "TemperaturMonitor-${VERSION}.msi.sha256"; do
            if awk -v name="$wanted" '$1 == name { found = 1 } END { exit !found }' assets.tsv; then
              echo "OK      $wanted"
            else
              echo "::error::$wanted is missing - the release job of the TemperatureLogger workflow would fail."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          echo "The App token can read the expected assets."
