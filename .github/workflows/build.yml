name: TemperatureLogger Build

on:
  workflow_dispatch:

jobs:
  get_default_envs:
    name: Gather Environments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Get default environments
        id: envs
        run: |
          echo "environments=$(pio project config --json-output | jq -cr '.[1][1][0][1]|split(",")')" >> $GITHUB_OUTPUT

    outputs:
      environments: ${{ steps.envs.outputs.environments }}

  build:
    name: Build Enviornments
    runs-on: ubuntu-latest
    needs: get_default_envs
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.get_default_envs.outputs.environments) }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tags
        run: git fetch --force --tags origin

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio setuptools

      - name: Setup Node.js and yarn
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: "webapp/yarn.lock"

      - name: Install WebApp dependencies
        run: yarn --cwd webapp install --frozen-lockfile

      - name: Build WebApp
        run: yarn --cwd webapp build

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Rename Firmware
        run: mv .pio/build/${{ matrix.environment }}/firmware.bin .pio/build/${{ matrix.environment }}/templogger-${{ matrix.environment }}.bin

      - name: Rename Factory Firmware
        run: mv .pio/build/${{ matrix.environment }}/firmware.factory.bin .pio/build/${{ matrix.environment }}/templogger-${{ matrix.environment }}.factory.bin

      - uses: actions/upload-artifact@v4
        with:
          name: templogger-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/templogger-${{ matrix.environment }}.bin
            .pio/build/${{ matrix.environment }}/templogger-${{ matrix.environment }}.factory.bin

  update-install-binaries:
    name: Open PR with firmware binaries
    runs-on: ubuntu-latest
    needs: [get_default_envs, build]
    # Only for a manual run on the master branch. A run on a tag creates the release instead.
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Copy firmware binaries into install directory
        run: |
          for dir in artifacts/*/; do
            environment="$(basename "$dir")"
            mkdir -p "install/$environment"
            cp "$dir$environment.bin" "$dir$environment.factory.bin" "install/$environment/"
          done
          rm -rf artifacts

      - name: Check that all binaries were copied
        run: |
          found=$(ls -1 install/*/*.bin 2>/dev/null | wc -l)
          echo "Found $found binary files in install/"
          [ "$found" -eq 4 ] || { echo "Expected 4 binaries, got $found"; exit 1; }

      - name: Read version from source
        id: version
        run: |
          version=$(sed -n 's/^#define TEMP_LOGGER_VERSION "\(.*\)".*/\1/p' include/Logger/DS18B20List.h | tr -d '\r')
          echo "version=$version" >> $GITHUB_OUTPUT

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/install-binaries
          delete-branch: true
          add-paths: install
          commit-message: |
            install: update firmware binaries to ${{ steps.version.outputs.version }} (CI build #${{ github.run_number }})
          title: "install: update firmware binaries to ${{ steps.version.outputs.version }}"
          body: |
            Automated update of the firmware binaries in the `install` directory.

            - Version: `${{ steps.version.outputs.version }}`
            - Source commit: `${{ github.sha }}`
            - Workflow run: #${{ github.run_number }}

            The binaries were built by the *TemperatureLogger Build* workflow and copied into
            `install/<environment>/` for every environment configured in `custom_ci_action`.

            Please review and merge this PR before creating the release tag, otherwise the
            `install` directory of the release will still contain the previous binaries.

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [get_default_envs, build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v3
        with:
          failOnError: true
          commitMode: true
          configuration: ".github/workflows/config/release-notes-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Move all files to the same location
        run: |
          ls -R
          cd artifacts
          for i in */; do cp ${i}templogger-*.bin ./; done

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{steps.github_release.outputs.changelog}}
          draft: False
          files: |
            artifacts/*.zip, artifacts/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
