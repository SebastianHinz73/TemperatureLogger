name: TemperatureLogger Build

on:
  workflow_dispatch:
    inputs:
      monitor_version:
        description: "TemperaturMonitor version from SebastianHinz73/Tools to attach to the release"
        required: false
        default: "1.0.0"

jobs:
  get_default_envs:
    name: Gather Environments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Get default environments
        id: envs
        run: |
          echo "environments=$(pio project config --json-output | jq -cr '.[1][1][0][1]|split(",")')" >> $GITHUB_OUTPUT

    outputs:
      environments: ${{ steps.envs.outputs.environments }}

  build:
    name: Build Enviornments
    runs-on: ubuntu-latest
    needs: get_default_envs
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.get_default_envs.outputs.environments) }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tags
        run: git fetch --force --tags origin

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio setuptools

      - name: Setup Node.js and yarn
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: "webapp/yarn.lock"

      - name: Install WebApp dependencies
        run: yarn --cwd webapp install --frozen-lockfile

      - name: Build WebApp
        run: yarn --cwd webapp build

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Rename Firmware
        run: mv .pio/build/${{ matrix.environment }}/firmware.bin .pio/build/${{ matrix.environment }}/templogger-${{ matrix.environment }}.bin

      - name: Rename Factory Firmware
        run: mv .pio/build/${{ matrix.environment }}/firmware.factory.bin .pio/build/${{ matrix.environment }}/templogger-${{ matrix.environment }}.factory.bin

      - uses: actions/upload-artifact@v4
        with:
          name: templogger-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/templogger-${{ matrix.environment }}.bin
            .pio/build/${{ matrix.environment }}/templogger-${{ matrix.environment }}.factory.bin

  update-install-binaries:
    name: Open PR with firmware binaries
    runs-on: ubuntu-latest
    needs: [get_default_envs, build]
    # Only for a manual run on a tag. The binaries are then built from the tagged commit, so
    # __COMPILED_GIT_HASH__ contains the tag (e.g. "V2.1.5") instead of a bare commit hash.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The PR is opened against master, the binaries come from the artifacts of the tagged build
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Copy firmware binaries into install directory
        run: |
          for dir in artifacts/*/; do
            environment="$(basename "$dir")"
            mkdir -p "install/$environment"
            cp "$dir$environment.bin" "$dir$environment.factory.bin" "install/$environment/"
          done
          rm -rf artifacts

      - name: Check that all binaries were copied
        run: |
          found=$(ls -1 install/*/*.bin 2>/dev/null | wc -l)
          echo "Found $found binary files in install/"
          [ "$found" -eq 4 ] || { echo "Expected 4 binaries, got $found"; exit 1; }

      - uses: peter-evans/create-pull-request@v6
        with:
          base: master
          branch: ci/install-binaries
          delete-branch: true
          add-paths: install
          commit-message: |
            install: update firmware binaries to ${{ github.ref_name }} (CI build #${{ github.run_number }})
          title: "install: update firmware binaries to ${{ github.ref_name }}"
          body: |
            Automated update of the firmware binaries in the `install` directory.

            - Tag: `${{ github.ref_name }}`
            - Source commit: `${{ github.sha }}`
            - Workflow run: #${{ github.run_number }}

            The binaries were built from the tag, so the firmware reports the tag instead of a
            commit hash. They were copied into `install/<environment>/` for every environment
            configured in `custom_ci_action`.

            The release assets are created by the same workflow run, so merging this PR only
            keeps the `install` directory in the repository in sync.

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [get_default_envs, build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v3
        with:
          failOnError: true
          commitMode: true
          configuration: ".github/workflows/config/release-notes-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Move all files to the same location
        run: |
          ls -R
          cd artifacts
          for i in */; do cp ${i}templogger-*.bin ./; done

      - name: Build install zip
        run: |
          # The tag is the single source of truth for the version, e.g. "V2.1.5" -> "2.1.5"
          version=$(echo "$GITHUB_REF_NAME" | sed 's/^[^0-9]*//')

          # Stage the install directory of the tag and replace the binaries with the ones
          # that were just built, because the tagged commit still contains the previous ones.
          mkdir -p staging
          cp -r install staging/install
          for dir in artifacts/*/; do
            environment="$(basename "$dir")"
            cp "$dir$environment.bin" "$dir$environment.factory.bin" "staging/install/$environment/"
          done

          (cd staging && zip -r "$GITHUB_WORKSPACE/install_v${version}.zip" install)
          unzip -l "install_v${version}.zip"

      - name: Create access token for the Tools repository
        id: tools-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TOOLS_APP_ID }}
          private-key: ${{ secrets.TOOLS_APP_PRIVATE_KEY }}
          owner: SebastianHinz73
          repositories: Tools
          permission-contents: read

      - name: Download TemperaturMonitor from the Tools repository
        env:
          GH_TOKEN: ${{ steps.tools-token.outputs.token }}
          VERSION: ${{ inputs.monitor_version }}
        run: |
          set -euo pipefail

          mkdir -p monitor

          # Look the assets up by name so that the tag naming of the Tools repository does not matter
          gh api "repos/SebastianHinz73/Tools/releases?per_page=100" \
            --jq '.[].assets[] | "\(.name)\t\(.id)"' > monitor/assets.tsv

          asset_id() { awk -v name="$1" '$1 == name { print $2; exit }' monitor/assets.tsv; }

          id=$(asset_id "TemperaturMonitor-${VERSION}.msi")
          if [ -z "$id" ]; then
            echo "::error::Asset 'TemperaturMonitor-${VERSION}.msi' not found in SebastianHinz73/Tools."
            echo "Available assets:"
            cut -f1 monitor/assets.tsv | sort -u
            exit 1
          fi

          gh api "repos/SebastianHinz73/Tools/releases/assets/${id}" \
            -H "Accept: application/octet-stream" > "monitor/TemperaturMonitor-${VERSION}.msi"

          sha_id=$(asset_id "TemperaturMonitor-${VERSION}.msi.sha256")
          if [ -n "$sha_id" ]; then
            gh api "repos/SebastianHinz73/Tools/releases/assets/${sha_id}" \
              -H "Accept: application/octet-stream" > "monitor/TemperaturMonitor-${VERSION}.msi.sha256"

            expected=$(awk '{ print $1 }' "monitor/TemperaturMonitor-${VERSION}.msi.sha256")
            actual=$(sha256sum "monitor/TemperaturMonitor-${VERSION}.msi" | awk '{ print $1 }')
            if [ "$expected" != "$actual" ]; then
              echo "::error::sha256 mismatch for TemperaturMonitor-${VERSION}.msi (expected $expected, got $actual)"
              exit 1
            fi
            echo "sha256 verified: $actual"
          else
            (cd monitor && sha256sum "TemperaturMonitor-${VERSION}.msi" > "TemperaturMonitor-${VERSION}.msi.sha256")
            echo "::warning::No .sha256 asset in the Tools repository, generated one locally."
          fi

          ls -l monitor

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{steps.github_release.outputs.changelog}}
          draft: False
          files: |
            artifacts/*.bin
            install_v*.zip
            monitor/*.msi
            monitor/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
